<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>flynt.js - Demo files</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="p-8 bg-gray-50 text-gray-900">
    <header class="py-4">
      <p class="items-end justify-center flex gap-3">
        <img src="./logo.svg" alt="Flynt.js Logo" width="80" height="auto" />
        <span class="text-gray-500 text-lg">flynt.js</span>
      </p>
    </header>
    <main>
      <div
        class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow flex flex-col gap-5"
      >
        <a
          href="./count-demo.html"
          target="_blank"
          class="group flex flex-col text-lg text-gray-600 hover:text-orange-500"
        >
          <span class="group-hover:underline group-active:underline font-bold"
            >Counter example</span
          >
          <span class="text-gray-500">
            Showcases simple state & derived state
          </span>
        </a>
        <a
          href="./array-demo.html"
          target="_blank"
          class="group flex flex-col text-lg text-gray-600 hover:text-orange-500"
        >
          <span class="group-hover:underline group-active:underline font-bold"
            >Array map example</span
          >
          <span class="text-gray-500">
            Showcases array with map reconciliation helper & pagination
          </span>
        </a>
        <a
          href="./fetch-demo.html"
          target="_blank"
          class="group flex flex-col text-lg text-gray-600 hover:text-orange-500"
        >
          <span class="group-hover:underline group-active:underline font-bold"
            >Debounced fetch example</span
          >
          <span class="text-gray-500">
            Showcases the debounce & fetch helper with auto-abort
          </span>
        </a>
      </div>
    </main>
  </body>
</html>
